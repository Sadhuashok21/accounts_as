{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{% block description %} {% endblock %}">
    <meta name="keywords" content="{% block keywords %} {% endblock %}">
    <title>{% block title %}  {% endblock %} || Ascentracore Solutions</title>
    <link rel="stylesheet" href="{% block stylesheet %}  {% endblock %}">
    <link rel="stylesheet" href="{% block "extra_stylesheet" %} {% endblock %}">
    <link rel="icon" href="{% static 'images/favicon.ico' %}" type="image/x-icon">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-WN9BKPTPEX"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());

        gtag('config', 'G-WN9BKPTPEX');
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
</head>
<body>
    {% block sidebar %} {%endblock %}
    <div class="container">
        <div class="content">
            {% block content %}


            {% endblock %}
        </div>
    </div>

 <script type="module" src="{% static 'js/' %}{{data}}.js">

 </script>

</body>
</html>
